[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-reason"
version = "1.0.0"
description = "Enterprise GeoAI Analysis Platform using LLMs for autonomous geospatial analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Geo-Reason Team"}
]
keywords = ["geoai", "geospatial", "llm", "gis", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.41.0",
    "sentence-transformers>=2.2.0",
]
geo = [
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "fiona>=1.9.0",
    "osmnx>=1.6.0",
    "folium>=0.15.0",
    "rasterstats>=0.19.0",
]
rag = [
    "chromadb>=0.4.20",
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
]
ui = [
    "streamlit>=1.29.0",
    "streamlit-folium>=0.15.0",
]
docs = [
    "pypdf>=3.17.0",
    "markdown>=3.5.0",
    "python-docx>=1.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "mypy>=1.8.0",
]
all = [
    "geo-reason[ml,geo,rag,ui,docs,dev]",
]

[project.scripts]
geo-reason = "geo_reason.ui.app:main"

[project.urls]
Homepage = "https://github.com/Anamitra-Sarkar/wings_of_ai"
Repository = "https://github.com/Anamitra-Sarkar/wings_of_ai"

[tool.setuptools.packages.find]
where = ["."]
include = ["geo_reason*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
